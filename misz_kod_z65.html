<div id="pierwszy_miszkiel">

<p>
Pierwszy akapit/pierwszy DIV --> nazwisko ucznia Miszkiel<br>
nazwa ID akapitu id="pierwszy_miszkiel"
</p>

<p>
Drugi akapit/pierwszy DIV<br>
pierwszy akapit -> p:first-child {font-size:9mm;font-style:italic;}<br>
bo numer parzysty w dzienniku<br>
pozostałe akapity -> p {font-size:10pt;} bo numer parzysty<br>
szerokość bloku = 700+20*4=756pt<br>
pierwszy DIV --> kolor różowy
</p>

<p>
Trzeci akapit/pierwszy DIV<br>
pierwszy DIV --> obramowanie fioletowe<br>
pierwszy DIV --> obramowanie grubość 7px, ciągłe (solid)<br>
pierwszy DIV --> r1=7+4=11px
</p>

</div>

<br>

<div id="drugi_miszkiel">

<p>
Pierwszy akapit/drugi DIV --> imię ucznia Igor<br>
nazwa ID akapitu id="drugi_miszkiel"
</p>

<p>
Drugi akapit/drugi DIV<br>
drugi DIV --> kolor jasnozielony
</p>

<p>
Trzeci akapit/drugi DIV<br>
drugi DIV --> obramowanie czarne<br>
drugi DIV --> obramowanie grubość 3px, ciągłe (solid)<br>
drugi DIV --> r2=7+8=15px
</p>

</div>

<br>

<div id="trzeci_miszkiel">

<p>
Pierwszy akapit/trzeci DIV --> klasa 1P grupa G1<br>
nazwa ID akapitu id="trzeci_miszkiel"
</p>

<p>
Drugi akapit/trzeci DIV<br>
trzeci DIV --> kolor jasnoniebieski
</p>

<p>
Trzeci akapit/trzeci DIV<br>
trzeci DIV --> obramowanie granatowe<br>
trzeci DIV --> obramowanie grubość 5px, ciągłe (solid)<br>
trzeci DIV --> r3=7+2=9px
</p>

</div>
